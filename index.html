<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <title>Supabase test</title>
</head>
<body>
  <h1>Supabase test</h1>
  <pre id="output">laden...</pre>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

    const supabaseUrl = "https://ctyykjlvjomaazhuljxn.supabase.co";
    const supabaseKey = "sb_publishable_Kn_j9ixLtMOT0eHOmcL16w_coqqkRTS"; // jouw key hier
    const supabase = createClient(supabaseUrl, supabaseKey);

    const output = document.getElementById("output");

    async function test() {
      const { data, error } = await supabase
        .from("players")
        .select("*");

      if (error) {
        output.textContent = "ERROR:\n" + JSON.stringify(error, null, 2);
      } else {
        output.textContent = "SUCCESS:\n" + JSON.stringify(data, null, 2);
      }
    }

    test();
  </script>
</body>
</html>
